spring.application.name=ecommerce-backend

# ==========================================
# Configuración de Base de Datos (Supabase - PostgreSQL)
# ==========================================
# Reemplaza con los datos de tu proyecto de Supabase:
# Settings -> Database -> Connection string (URI / JDBC / Session Pooler)
spring.datasource.url=${DB_URL:jdbc:postgresql://<TU_HOST_O_POOLER_SUPABASE>:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:tu_password_aqui}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# Configuración de Hibernate / JPA
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
