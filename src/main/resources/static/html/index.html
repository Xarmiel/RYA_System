<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RYA | Catálogo de tecnología</title>
<!-- Reemplazar este archivo por el favicon oficial de RYA en formato PNG 32x32. -->
<link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/header.css">
<link rel="stylesheet" href="../css/carousel.css">
<link rel="stylesheet" href="../css/products.css">
<link rel="stylesheet" href="../css/filters.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<header>
  <a class="logo logo-link" href="inicio.html" aria-label="RYA, página de inicio"><img class="logo-image" src="../images/RYA.jpeg" alt="Logo de RYA Tech"></a>
  <nav>
    <ul>
      <li><a href="#">Catálogo</a></li>
      <li><a href="#">Consultoria</a></li>
      <li><a href="#">Soporte</a></li>
    </ul>
  </nav>
  <div class="nav-icons">
    <div class="search-box">
      <input type="text" placeholder="Buscar productos...">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </div>
    <button class="icon-btn" aria-label="Cuenta">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"></path>
      </svg>
    </button>
    <button class="cart-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"></path>
      </svg>
      Carrito (0)
    </button>
  </div>
</header>

<main class="page-content">
  
  <!-- BARRA DE HERRAMIENTAS (TOOLBAR) -->
  <div class="shop-toolbar">
    <button id="btnOpenFilters" class="filter-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
      </svg>
      Filtros <span id="filterCount">(0)</span>
    </button>
    <div class="sort-box">
      <select>
        <option>Ordenar por: Relevancia</option>
        <option>Precio: Menor a Mayor</option>
        <option>Precio: Mayor a Menor</option>
        <option>Lo más nuevo</option>
      </select>
    </div>
  </div>

  <!-- FONDO OSCURO DEL MENÚ LATERAL -->
  <div class="filter-overlay" id="filterOverlay"></div>

  <!-- MENÚ LATERAL DE FILTROS -->
  <aside class="filter-sidebar" id="filterSidebar">
    <div class="filter-header">
      <h3>Filtros</h3>
      <button id="btnCloseFilters" class="icon-btn" aria-label="Cerrar filtros">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="filter-body" id="dynamicFilterContainer">
      <!-- Los filtros se generarán dinámicamente aquí -->

    </div>

    <div class="filter-footer">
      <button id="btnClearFilters" class="btn-ghost">Limpiar filtros</button>
      <button id="btnApplyFilters" class="btn-primary">Ver resultados</button>
    </div>
  </aside>


  <!-- Catálogo dinámico: main.js crea automáticamente una sección de carrusel
       por cada categoría con productos (Placas Madre, Procesadores, GPU, etc). -->
  <div id="carousels-container"></div>

  <!-- MARCAS DESTACADAS -->
  <section class="section">
    <h2 class="section-title">Marcas destacadas</h2>
    <div class="brands-grid">
      <div class="brand-box">[Logo Marca 1]</div>
      <div class="brand-box">[Logo Marca 2]</div>
      <div class="brand-box">[Logo Marca 3]</div>
      <div class="brand-box">[Logo Marca 4]</div>
      <div class="brand-box">[Logo Marca 5]</div>
      <div class="brand-box">[Logo Marca 6]</div>
    </div>
  </section>

</main>

<script type="module" src="../js/main.js"></script>
</body>
</html>
