<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOLTA — Tecnología que se siente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="logo">RYA</div>
  <nav>
    <ul>
      <li><a href="#">Catálogo</a></li>
      <li><a href="#">Ofertas</a></li>
      <li><a href="#">Soporte</a></li>
    </ul>
  </nav>
  <div class="nav-icons">
   <div class="search-box">
  <input type="text" placeholder="Buscar productos...">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="11" cy="11" r="7"></circle>
    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
  </svg>
</div>

<button class="icon-btn" aria-label="Favoritos">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"></path>
  </svg>
</button>

<button class="icon-btn" aria-label="Cuenta">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <circle cx="12" cy="8" r="4"></circle>
    <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"></path>
  </svg>
</button>

<button class="cart-btn">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="9" cy="21" r="1"></circle>
    <circle cx="20" cy="21" r="1"></circle>
    <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"></path>
  </svg>
  Carrito (0)
</button>
  </div>
</header>

<section class="hero">
  <div class="hero-copy">
    <div class="eyebrow">Lo que necesitas</div>
    <h1>Calidad<br>en cada <span>entrega</span></h1>
    <p class="hero-sub">
      Tecnología pensada para acompañarte todos los días: rendimiento real,
      diseño que dura y envíos a todo el país.
    </p>
    <div class="hero-actions">
      <button class="btn-primary">Ver catálogo</button>
      <a href="#" class="btn-ghost">Cómo funciona →</a>
    </div>
  </div>

  <div class="hero-visual" id="heroVisual">
    <div class="ring ring-2"></div>
    <div class="ring ring-1"></div>
    <div class="glow" id="glow"></div>
    <div class="product-slot" id="productSlot"></div>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
